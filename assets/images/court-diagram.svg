<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="courtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#09231a"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4ff00"/>
      <stop offset="100%" stop-color="#a3d600"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#courtBg)"/>
  
  <!-- Subtle Tennis Court Lines -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="3" fill="none">
    <rect x="100" y="50" width="600" height="350"/>
    <line x1="160" y1="50" x2="160" y2="400"/>
    <line x1="640" y1="50" x2="640" y2="400"/>
    <line x1="160" y1="125" x2="640" y2="125"/>
    <line x1="160" y1="325" x2="640" y2="325"/>
    <line x1="400" y1="125" x2="400" y2="325"/>
    <line x1="400" y1="40" x2="400" y2="410" stroke="#bbf000" stroke-width="4" stroke-dasharray="8,6"/>
  </g>

  <!-- Title Badge -->
  <circle cx="400" cy="225" r="75" fill="#09231a" stroke="#bbf000" stroke-width="4"/>
  <text x="400" y="215" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">MICHAEL MERCIER</text>
  <text x="400" y="245" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#bbf000" letter-spacing="3" text-anchor="middle">USPTA MASTER PRO</text>
  <text x="400" y="265" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">20 YRS HEAD PRO AT HARVARD</text>
</svg>
